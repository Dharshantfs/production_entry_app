[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production_entry"
version = "0.1.0"
authors = [
    { name = "Your Company", email = "info@yourcompany.com" },
]
description = "Production Planning and Queuing System for Manufacturing Units"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24.0",
  "Pillow>=10.0.0",
  "opencv-python-headless>=4.8.0",
  "openpyxl>=3.1.0",
  "pytesseract>=0.3.10",
  "rapidocr-onnxruntime>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/Dharshantfs/production_entry"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["production_entry*"]

# Frappe Cloud / pip installs must ship DocType JSON, workspace JSON, and public assets.
[tool.setuptools.package-data]
production_entry = [
  "production_planning/**/*.json",
  "patches/*.py",
  "public/**/*",
  "config/*.py",
]
