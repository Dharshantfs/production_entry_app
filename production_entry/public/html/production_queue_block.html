<div class="pq-wrap" style="padding:16px 20px 28px;font-family:inherit;">
  <div style="margin-bottom:14px;">
    <div style="font-size:18px;font-weight:700;color:#0f172a;">Your boards</div>
    <div style="font-size:13px;color:#64748b;margin-top:4px;">
      Only boards from Production Board Access are listed here.
    </div>
  </div>
  <div class="pq-cards" style="display:flex;flex-wrap:wrap;gap:12px;"></div>
  <div class="pq-hint" style="margin-top:16px;font-size:12px;color:#94a3b8;"></div>
</div>

<script>
(function () {
  const root = typeof root_element !== "undefined" ? root_element : document;
  const cardsEl = root.querySelector(".pq-cards");
  const hintEl = root.querySelector(".pq-hint");
  if (!cardsEl) return;

  function esc(s) {
    try {
      return frappe.utils.escape_html(String(s || ""));
    } catch (e) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }
  }

  function cardHtml(b) {
    return (
      '<a href="/app/' +
      esc(b.slug) +
      '" class="pq-card" style="' +
      "display:block;min-width:200px;max-width:260px;flex:1 1 200px;" +
      "padding:14px 16px;border-radius:10px;border:1px solid #cbd5e1;" +
      "background:#fff;text-decoration:none;color:inherit;" +
      "box-shadow:0 1px 2px rgba(15,23,42,.08);" +
      '">' +
      '<div style="font-weight:700;font-size:15px;color:#0f172a;">' +
      esc(b.label) +
      "</div>" +
      '<div style="font-size:12px;color:#64748b;margin-top:6px;">' +
      esc(b.desc || "") +
      "</div>" +
      '<div style="font-size:12px;color:#2563eb;margin-top:10px;font-weight:600;">Open →</div>' +
      "</a>"
    );
  }

  function render(boards) {
    cardsEl.innerHTML = (boards || []).map(cardHtml).join("");
    if (!(boards || []).length) {
      hintEl.textContent =
        "No boards granted. Admin must add a row under Production Board Access → Allowed Production Boards (or Color Chart / GSM tables).";
    } else {
      hintEl.textContent = "Showing " + boards.length + " board(s) from your access.";
    }
  }

  frappe.call({
    method: "production_entry.production_planning.board_access.get_board_launcher_links",
    callback: function (r) {
      const msg = (r && r.message) || { boards: [] };
      render(msg.boards || []);
    },
    error: function () {
      render([]);
    },
  });
})();
</script>
